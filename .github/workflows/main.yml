name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # gradlew olmadığı için Gradle'ı doğrudan kuruyoruz
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: tiramisu-mod
          path: build/libs/*.jar
